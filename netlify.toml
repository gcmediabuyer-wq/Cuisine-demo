[build]
  publish = "pages"
  functions = "netlify/functions"

  [[redirects]]
  from = "/"
  to = "/atelier-cuisines-paris/"
  status = 302
  force = true

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
